<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis</title>
    <meta name="description" content="Market intelligence powered by anonymous ZK signals. Stores see what customers want. Customers stay invisible." />
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- La app del móvil (/app) se puede instalar en la pantalla de inicio. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aegis" />
    <meta name="theme-color" content="#F5F7F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080C11" media="(prefers-color-scheme: dark)" />

    <!-- Vista previa al compartir el enlace (WhatsApp, X, LinkedIn, Slack...).
         La imagen necesita una URL absoluta: apunta a la versión publicada. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aegis" />
    <meta property="og:title" content="Aegis · Private market intelligence" />
    <meta property="og:description" content="Market intelligence powered by anonymous ZK signals. Stores see what customers want. Customers stay invisible." />
    <meta property="og:url" content="https://aegis-midnight.vercel.app/" />
    <meta property="og:image" content="https://aegis-midnight.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AEGIS logo" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist (variable) y Geist Mono: los pesos que usa la interfaz. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
